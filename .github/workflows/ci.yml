name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app.py config.py state.py agents.py tools.py workflow.py persistence.py llm.py dashboard.py

      - name: Dependency check
        run: pip check

      - name: Run tests
        run: pytest -q

  smoke:
    name: container smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run smoke suite
        run: ./scripts/smoke_test.sh --docker
